<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Ledger-dark background, matching the app's own ink surface -->
  <rect width="512" height="512" rx="115" fill="#14110d"/>

  <g transform="translate(256,256) scale(1.15) translate(-248,-272)">
    <!-- Vinyl record: the app's own "record-collector's ledger" motif -->
    <circle cx="210" cy="300" r="160" fill="#2b2822"/>
    <circle cx="210" cy="300" r="120" fill="none" stroke="#4a453c" stroke-width="6"/>
    <circle cx="210" cy="300" r="82" fill="none" stroke="#4a453c" stroke-width="6"/>

    <!-- Label + spindle -->
    <circle cx="210" cy="300" r="45" fill="#e8823c"/>
    <circle cx="210" cy="300" r="8" fill="#14110d"/>

    <!-- Tonearm resting on the record -->
    <line x1="420" y1="110" x2="250" y2="190" stroke="#f2ecdf" stroke-width="20" stroke-linecap="round"/>
    <circle cx="420" cy="110" r="26" fill="#f2ecdf"/>
    <circle cx="250" cy="190" r="15" fill="#e8823c"/>
  </g>
</svg>
