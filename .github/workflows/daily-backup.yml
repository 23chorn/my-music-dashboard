# .github/workflows/daily-backup.yml
name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install dependencies
      working-directory: backend
      run: |
        echo "📦 Installing required packages..."
        npm ci
        
    - name: Verify backup script exists
      run: |
        if [ ! -f "backend/scripts/backup/supabase_backup.js" ]; then
          echo "❌ Backup script not found at backend/scripts/backup/supabase_backup.js"
          echo "Please ensure the backup script exists in your repository"
          ls -la backend/scripts/ || echo "Backend scripts directory doesn't exist"
          exit 1
        fi
        echo "✅ Backup script found"
        
    - name: Create backup directory
      run: mkdir -p backend/supabase_backups
      
    - name: Debug environment and run backup script
      working-directory: backend
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        GITHUB_ACTIONS: true
      run: |
        echo "🔍 Debug Info:"
        echo "Working directory: $(pwd)"
        echo "GITHUB_ACTIONS: $GITHUB_ACTIONS"
        echo "SUPABASE_URL length: ${#SUPABASE_URL}"
        echo "SUPABASE_ANON_KEY length: ${#SUPABASE_ANON_KEY}"
        echo "SUPABASE_URL starts with: ${SUPABASE_URL:0:20}..."
        echo ""
        echo "🚀 Starting backup process..."
        node scripts/backup/supabase_backup.js backup
        
    - name: Verify backup was created
      run: |
        if [ ! -d "backend/supabase_backups" ] || [ -z "$(ls -A backend/supabase_backups)" ]; then
          echo "❌ No backup was created"
          exit 1
        fi
        echo "✅ Backup created successfully"
        ls -la backend/supabase_backups/
        
    - name: Prepare backup archive
      run: |
        cd backend/supabase_backups
        BACKUP_DIR=$(ls -t | head -n1)
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        ARCHIVE_NAME="supabase_backup_${TIMESTAMP}.tar.gz"
        
        echo "📦 Creating archive: $ARCHIVE_NAME"
        tar -czf "$ARCHIVE_NAME" "$BACKUP_DIR"
        
        # Get backup stats
        BACKUP_SIZE=$(du -sh "$BACKUP_DIR" | cut -f1)
        RECORD_COUNT="0"
        if [ -f "$BACKUP_DIR/manifest.json" ]; then
          RECORD_COUNT=$(grep -o '"total_records":[0-9]*' "$BACKUP_DIR/manifest.json" | cut -d: -f2 || echo "0")
        fi
        
        echo "BACKUP_DIR=$BACKUP_DIR" >> $GITHUB_ENV
        echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
        echo "BACKUP_SIZE=$BACKUP_SIZE" >> $GITHUB_ENV
        echo "RECORD_COUNT=$RECORD_COUNT" >> $GITHUB_ENV
        echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
        echo "BACKUP_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
        echo "BACKUP_DATETIME=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
        
        # Move archive to root for upload
        mv "$ARCHIVE_NAME" "../../$ARCHIVE_NAME"
        
        echo "📊 Backup stats:"
        echo "   Directory: $BACKUP_DIR"
        echo "   Archive: $ARCHIVE_NAME"
        echo "   Size: $BACKUP_SIZE"
        echo "   Records: $RECORD_COUNT"
        
    - name: Upload backup to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: backup-${{ env.TIMESTAMP }}
        name: 📦 Database Backup - ${{ env.BACKUP_DATE }}
        body: |
          ## 🗄️ Automated Supabase Database Backup
          
          **📅 Created**: ${{ env.BACKUP_DATETIME }}  
          **📊 Records**: ${{ env.RECORD_COUNT }}
          **💾 Size**: ${{ env.BACKUP_SIZE }}
          **🔄 Workflow Run**: ${{ github.run_number }}
          **📂 Backup ID**: ${{ env.TIMESTAMP }}
          
          ### 📋 Contents:
          - Complete database dump (JSON format)
          - CSV exports for easy viewing
          - Automated restore script  
          - Backup manifest with metadata
          
          ### 🔄 How to Restore:
          
          1. **Download** the backup archive below
          2. **Extract** the archive: `tar -xzf supabase_backup_${{ env.TIMESTAMP }}.tar.gz`
          3. **Navigate** to extracted folder: `cd backup_*/`
          4. **Set up environment** file:
             ```bash
             echo "SUPABASE_URL=your_target_supabase_url" > .env
             echo "SUPABASE_ANON_KEY=your_target_supabase_key" >> .env
             ```
          5. **Install dependencies**: `npm install @supabase/supabase-js dotenv`
          6. **Test restore** (optional): `node restore.js --dry-run`
          7. **Run restore**: `node restore.js --confirm`
          
          ### 🧪 Safe Testing:
          - Use `--dry-run` to preview what will be restored
          - Use `--help` to see all available options
          - Restore reassigns IDs but preserves all relationships
          
          ### ⚠️ Important:
          - Restore will **replace all data** in target database
          - Test in development environment first
          - Ensure target database has same schema structure
          
          ---
          *Automated backup via GitHub Actions*
        files: ${{ env.ARCHIVE_NAME }}
        draft: false
        prerelease: false
        
    - name: Cleanup old releases
      uses: dev-drprasad/delete-older-releases@v0.3.2
      with:
        keep_latest: 30
        delete_tags: true
        delete_tag_pattern: "backup-"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Report results
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ SUCCESS: Database backup completed!"
          echo ""
          echo "📊 Summary:"
          echo "   Records backed up: ${{ env.RECORD_COUNT }}"
          echo "   Backup size: ${{ env.BACKUP_SIZE }}"  
          echo "   Archive: ${{ env.ARCHIVE_NAME }}"
          echo ""
          echo "🔗 Download from: https://github.com/${{ github.repository }}/releases/tag/backup-${{ env.TIMESTAMP }}"
        else
          echo "❌ FAILED: Backup process failed!"
          echo ""
          echo "🔍 Check the workflow logs above for error details"
          echo "Common issues:"
          echo "   - Missing SUPABASE_URL or SUPABASE_ANON_KEY secrets"
          echo "   - Backup script not found at scripts/supabase_backup.js"
          echo "   - Supabase API rate limiting or connectivity issues"
        fi