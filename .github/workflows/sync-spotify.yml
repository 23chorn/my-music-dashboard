name: Sync Spotify Plays

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual triggering
    inputs:
      sync_type:
        description: 'Type of sync to run'
        required: false
        default: 'sync'
        type: choice
        options:
        - sync
        - test
        - force

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./backend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Spotify sync
      env:
        SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        SPOTIFY_ACCESS_TOKEN: ${{ secrets.SPOTIFY_ACCESS_TOKEN }}
        SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        DATABASE_URL: ${{ secrets.SUPABASE_URL }}
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
        NODE_ENV: production
        TZ: Europe/London
        SYNC_METHOD: spotify
        DRY_RUN: false
      run: |
        SYNC_TYPE="${{ github.event.inputs.sync_type || 'sync' }}"
        echo "🔄 Running Spotify sync with type: $SYNC_TYPE"
        node scripts/simpleSpotifySync.js $SYNC_TYPE
        
    - name: Post-sync summary
      if: always()
      run: |
        echo "✅ Sync job completed"
        echo "Check the logs above for details on new plays added"
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Sync failed - check the logs for error details"
        echo "You may need to refresh your Spotify tokens"