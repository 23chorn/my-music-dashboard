name: Manual Materialized View Refresh

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to refresh'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - test
      force_recreate:
        description: 'Force recreate views (slower but ensures fresh structure)'
        required: false
        default: false
        type: boolean

jobs:
  manual-refresh:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
    
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
    
    - name: Set environment variables
      run: |
        if [ "${{ inputs.environment }}" = "test" ]; then
          echo "DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}" >> $GITHUB_ENV
          echo "DB_MODE=test" >> $GITHUB_ENV
        else
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "DB_MODE=production" >> $GITHUB_ENV
        fi
        echo "NODE_ENV=production" >> $GITHUB_ENV
    
    - name: Force recreate materialized views
      if: inputs.force_recreate == true
      run: |
        cd backend
        npm run create:matviews
      
    - name: Refresh materialized views (standard)
      if: inputs.force_recreate == false
      run: |
        cd backend
        npm run update:matviews
      
    - name: Check materialized view stats
      run: |
        cd backend
        npm run check:matviews

    - name: Summary
      run: |
        echo "✅ Materialized views refreshed successfully!"
        echo "Environment: ${{ inputs.environment }}"
        echo "Force recreate: ${{ inputs.force_recreate }}"